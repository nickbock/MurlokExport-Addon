name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Luacheck
      uses: lunarmodules/luacheck@v1
    - name: Every file in the TOC exists
      # A file listed in the TOC but missing fails in game with no build error.
      # Data\Export.lua is generated by the private data build, so it is skipped here.
      run: |
        grep -vE '^\s*(#|$)' MurlokExport/MurlokExport.toc | tr -d '\r' | tr '\\' '/' | while read -r f; do
          [ "$f" = "Data/Export.lua" ] && continue
          [ -f "MurlokExport/$f" ] || { echo "::error::TOC lists $f but it does not exist"; echo x >> /tmp/missing; }
        done
        [ ! -f /tmp/missing ]
